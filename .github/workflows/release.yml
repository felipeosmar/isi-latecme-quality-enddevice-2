name: Build and Release

on:
  push:
    branches:
      - main
      - salt_spray
  pull_request:
    branches:
      - main
      - salt_spray

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            build/lorawan-enddevice.bin
            build/www.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Calculate release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
            PR_NUM="${{ github.event.pull_request.number }}"
            TAG="${BRANCH}-pr${PR_NUM}"
            NAME="[${BRANCH}] PR #${PR_NUM}"
            PRERELEASE="true"
          else
            BRANCH="${{ github.ref_name }}"
            COUNT=$(gh api repos/${{ github.repository }}/releases \
              --paginate \
              --jq ".[] | select(.tag_name | startswith(\"${BRANCH}-r\")) | .tag_name" \
              2>/dev/null | wc -l || echo 0)
            NEXT=$((COUNT + 1))
            TAG="${BRANCH}-r${NEXT}"
            NAME="[${BRANCH}] Release #${NEXT}"
            PRERELEASE=$([[ "$BRANCH" != "main" ]] && echo "true" || echo "false")
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download firmware binaries
        uses: actions/download-artifact@v4
        with:
          name: firmware-binaries
          path: artifacts/

      - name: Rename binaries with tag
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          mv artifacts/lorawan-enddevice.bin artifacts/lorawan-enddevice-${TAG}.bin
          mv artifacts/www.bin artifacts/www-${TAG}.bin
          mv artifacts/bootloader/bootloader.bin artifacts/bootloader-${TAG}.bin
          mv artifacts/partition_table/partition-table.bin artifacts/partition-table-${TAG}.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/lorawan-enddevice-${{ steps.release_info.outputs.tag }}.bin
            artifacts/www-${{ steps.release_info.outputs.tag }}.bin
            artifacts/bootloader-${{ steps.release_info.outputs.tag }}.bin
            artifacts/partition-table-${{ steps.release_info.outputs.tag }}.bin
