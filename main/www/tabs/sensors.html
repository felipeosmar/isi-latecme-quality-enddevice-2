<h2>Sensors</h2>

<div class="card">
    <h3>Temperature & Humidity</h3>
    <div id="sensor-status">
        <div class="info-row"><span>Sensor</span><span id="sensor-name">--</span></div>
        <div class="info-row"><span>Temperature</span><span id="sensor-temp">-- &deg;C</span></div>
        <div class="info-row"><span>Humidity</span><span id="sensor-hum">-- %</span></div>
        <div class="info-row"><span>Last Read</span><span id="sensor-last-read">--</span></div>
    </div>
</div>

<div class="card" id="ds18b20-card">
    <h3>DS18B20 (External)</h3>
    <div class="info-row"><span>Temperature</span><span id="ds18b20-temp">-- &deg;C</span></div>
    <div class="info-row"><span>Status</span><span id="ds18b20-status">--</span></div>
</div>

<div class="card">
    <h3>Configuration</h3>
    <div class="info-row"><span>Read Interval</span><span id="sensor-interval">-- s</span></div>
    <div class="info-row"><span>Temp Correction</span><span id="sensor-temp-corr">-- &deg;C</span></div>
    <div class="info-row"><span>Hum Correction</span><span id="sensor-hum-corr">-- %</span></div>
</div>
