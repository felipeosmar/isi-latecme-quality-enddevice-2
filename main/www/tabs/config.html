<div class="config-layout">
<div class="config-sidebar">
<div class="card"><h3>WiFi</h3>
<div class="form-row"><select id="wifi-select"><option value="">Select network...</option></select>
<button onclick="scanWiFi()" class="btn">Scan</button></div>
<input type="password" id="wifi-pass" placeholder="Password">
<button onclick="connectWiFi()" class="btn btn-primary full">Connect</button></div>

<div class="card"><h3>Sensors</h3>
<div class="form-row"><label>Read Interval (s)</label><input type="number" id="cfg-sensor-interval" min="5" max="3600" value="30"></div>
<div class="form-row"><label>Temp Correction</label><input type="number" id="cfg-temp-corr" step="0.1" value="0.0"></div>
<div class="form-row"><label>Hum Correction</label><input type="number" id="cfg-hum-corr" step="0.1" value="0.0"></div>
<div class="form-row"><label>Device Name</label><input type="text" id="cfg-device-name" maxlength="31" value="sensor-01"></div>
<div id="tc-config-section"><div class="form-row"><label>Thermocouple</label><input type="checkbox" id="cfg-thermocouple" checked></div>
<div class="form-row"><label>TC Max Temp (°C)</label><input type="number" id="cfg-tc-max-temp" step="1" min="0" max="1024" value="200"></div>
<div class="form-row"><label>TC Min Temp (°C)</label><input type="number" id="cfg-tc-min-temp" step="1" min="-40" max="1024" value="0"></div>
<div class="form-row"><label>TC Correction (°C)</label><input type="number" id="cfg-tc-correction" step="0.1" value="0.0"></div></div>
<button onclick="saveSensorConfig()" class="btn full mt-2">Save Sensor Config</button></div>

<div class="card"><h3>Buzzer</h3>
<div class="form-row"><label>Volume (%)</label><input type="range" id="cfg-buzzer-vol" min="0" max="100" value="80"><span id="cfg-buzzer-vol-val">80</span></div>
<button onclick="saveBuzzerConfig()" class="btn full mt-2">Save Buzzer Config</button></div>

<div class="card"><h3>Alarmes</h3>
<div class="form-row"><label>Temp Ext. Ativo</label><input type="checkbox" id="cfg-alarm-temp-en"></div>
<div class="form-row"><label>Temp Ext. Min (°C)</label><input type="number" id="cfg-alarm-temp-low" step="0.1" value="0"></div>
<div class="form-row"><label>Temp Ext. Max (°C)</label><input type="number" id="cfg-alarm-temp-high" step="0.1" value="0"></div>
<div class="form-row"><label>Umidade Ativo</label><input type="checkbox" id="cfg-alarm-hum-en"></div>
<div class="form-row"><label>Umidade Min (%)</label><input type="number" id="cfg-alarm-hum-low" step="0.1" min="0" max="100" value="0"></div>
<div class="form-row"><label>Umidade Max (%)</label><input type="number" id="cfg-alarm-hum-high" step="0.1" min="0" max="100" value="0"></div>
<div id="tc-alarm-section"><div class="form-row"><label>Termopar Ativo</label><input type="checkbox" id="cfg-alarm-tc-en"></div>
<div class="form-row"><label>Termopar Min (°C)</label><input type="number" id="cfg-alarm-tc-low" step="0.1" value="0"></div>
<div class="form-row"><label>Termopar Max (°C)</label><input type="number" id="cfg-alarm-tc-high" step="0.1" value="0"></div></div>
<button onclick="saveAlarmConfig()" class="btn full mt-2">Salvar Alarmes</button></div>
</div>

<div class="config-main">
<div class="card">
<h3>LoRaWAN Configuration</h3>
<div class="config-section">
<div class="form-row"><label>DevEUI</label><input type="text" id="cfg-dev-eui" maxlength="16" placeholder="16 hex characters"></div>
<div class="form-row"><label>JoinEUI (AppEUI)</label><input type="text" id="cfg-join-eui" maxlength="16" placeholder="16 hex characters"></div>
<div class="form-row"><label>AppKey</label><input type="text" id="cfg-app-key" maxlength="32" placeholder="32 hex characters"></div>
<div class="form-row"><label>FPort</label><input type="number" id="cfg-lora-port" min="1" max="223" value="1"></div>
<div class="form-row"><label>Uplink Interval (s)</label><input type="number" id="cfg-uplink-interval" min="10" max="86400" value="60"></div>
<div class="form-row"><label>Sub-band (AU915)</label><select id="cfg-sub-band">
<option value="1">1</option><option value="2" selected>2</option>
<option value="3">3</option><option value="4">4</option>
<option value="5">5</option><option value="6">6</option>
<option value="7">7</option><option value="8">8</option></select></div>
<div class="form-row"><label>ADR</label><input type="checkbox" id="cfg-adr" checked></div>
</div>
<button onclick="saveLoRaConfig()" class="btn btn-primary full mt-2">Save LoRaWAN & Restart</button>
</div>

<div class="card"><h3>Web Auth</h3>
<div class="form-row"><label>Username</label><input type="text" id="cfg-web-user" value="admin"></div>
<div class="form-row"><label>Password</label><input type="password" id="cfg-web-pass" value="admin"></div>
<div class="form-row"><label>Enabled</label><input type="checkbox" id="cfg-web-auth" checked></div>
<button onclick="saveWebAuth()" class="btn full mt-2">Save Auth</button></div>
</div></div>
