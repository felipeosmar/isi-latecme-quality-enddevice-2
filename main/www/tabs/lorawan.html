<h2>LoRaWAN</h2>

<div class="card">
    <h3>Status</h3>
    <div class="info-row"><span>Join Status</span><span id="lora-join-status">Not Joined</span></div>
    <div class="info-row"><span>DevAddr</span><span id="lora-devaddr">--</span></div>
    <div class="info-row"><span>Uplink Count</span><span id="lora-uplink-count">0</span></div>
    <div class="info-row"><span>Last Uplink</span><span id="lora-last-uplink">--</span></div>
    <div class="info-row"><span>RSSI</span><span id="lora-rssi">-- dBm</span></div>
    <div class="info-row"><span>SNR</span><span id="lora-snr">-- dB</span></div>
    <div class="info-row"><span>Data Rate</span><span id="lora-data-rate">--</span></div>
</div>

<div class="card">
    <h3>Configuration</h3>
    <div class="form-row"><label>DevEUI</label><input type="text" id="lora-dev-eui" maxlength="16" placeholder="16 hex characters"></div>
    <div class="form-row"><label>JoinEUI (AppEUI)</label><input type="text" id="lora-join-eui" maxlength="16" placeholder="16 hex characters"></div>
    <div class="form-row"><label>AppKey</label><input type="text" id="lora-app-key" maxlength="32" placeholder="32 hex characters"></div>
    <div class="form-row"><label>FPort</label><input type="number" id="lora-port" min="1" max="223" value="1"></div>
    <div class="form-row"><label>Uplink Interval (s)</label><input type="number" id="lora-interval" min="10" max="86400" value="60"></div>
    <div class="form-row"><label>Sub-band (AU915)</label><select id="lora-sub-band">
        <option value="1">1</option><option value="2" selected>2</option>
        <option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option>
    </select></div>
    <div class="form-row"><label>ADR</label><input type="checkbox" id="lora-adr" checked></div>
    <button onclick="saveLoRaWANConfig()" class="btn btn-primary full mt-2">Save & Restart</button>
</div>

<div class="card">
    <h3>Actions</h3>
    <button onclick="forceJoin()" class="btn full">Force Re-Join</button>
</div>
