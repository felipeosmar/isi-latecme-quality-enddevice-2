; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration for all environments
[env]
platform = platformio/espressif32
board = esp32dev
framework = arduino
upload_port = ${sysenv.PIO_UPLOAD_PORT, /dev/ttyUSB0}
monitor_port = ${sysenv.PIO_MONITOR_PORT, /dev/ttyUSB0}
monitor_speed = 115200
build_flags =
    -std=c++14
    ; LoRa SPI pins configuration (common to all boards)
    -D LORA_SCK_PIN=5
    -D LORA_MISO_PIN=19
    -D LORA_MOSI_PIN=27
    -D LORA_SS_PIN=18
    -D LORA_RST_PIN=14
    -D LORA_DI0_PIN=26
lib_deps =
    ; Core libraries
    https://github.com/sandeepmistry/arduino-LoRa.git#f4a1d27
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    ; 1-Wire DS18B20 sensor
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

[env:JVTECHv30-SHT20]
board_build.partitions = minimal.csv
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
upload_resetmethod = nodemcu
build_flags =
    ${env.build_flags}
    -D BOARD_MODEL=JVTECHv40-SHT20
    -D BUTTON_PIN=25
    -D LED_PIN=2
    -D OLED_SDA_PIN=21
    -D OLED_SCL_PIN=22
    -D OLED_ADDRESS=0x3C
    -D SENSOR_TYPE_SHT20=1
lib_deps =
    ${env.lib_deps}
    dfrobot/DFRobot SHT@^1.0.0

